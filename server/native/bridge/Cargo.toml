[package]
name = "mirabase_bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MiraBase-owned thin C-ABI bridge (mb_* symbols) over the pinned Turso engine; also exports the turso_*/turso_sync_* symbols required by the upstream Go driver."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# The pinned engine's public Rust API (global mimalloc allocator + fts).
turso = { path = "../engine/bindings/rust" }
# Direct access to the engine's sync Rust API and IoBackend.
turso_sdk_kit = { path = "../engine/sdk-kit" }
# Required so this single payload cdylib also exports the turso_*/turso_sync_*
# C-ABI symbols that the pristine upstream Go driver binds via purego.
turso_sync_sdk_kit = { path = "../engine/sync/sdk-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
parking_lot = "0.12"
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[profile.release]
debug = false
lto = false
codegen-units = 16
